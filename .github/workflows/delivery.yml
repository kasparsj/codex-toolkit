name: Delivery

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: packages/delivery
      - run: npm run typecheck
        working-directory: packages/delivery
      - run: node --experimental-strip-types --test --test-concurrency=2 test/*.test.ts
        working-directory: packages/delivery
      - run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
        working-directory: plugins/paseo-delivery
      - run: npm run typecheck
        working-directory: plugins/paseo-delivery
      - run: npm test
        working-directory: plugins/paseo-delivery
