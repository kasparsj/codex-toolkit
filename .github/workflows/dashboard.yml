name: Dashboard and Delivery

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s dashboard/tests
      - run: python3 -m unittest discover -s workflows/github-delivery/tests
      - run: node --check dashboard/static/app.js
