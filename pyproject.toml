[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-toolkit"
version = "0.1.0"
description = "Installable GitHub Delivery coordinator for Codex Toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
codex-toolkit = "codex_toolkit.delivery_cli:main"

[tool.setuptools]
packages = ["codex_toolkit"]
